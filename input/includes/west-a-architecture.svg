<rect class="box" x="577.6" y="50" width="171.2" height="82" rx="6"/><text class="h" x="587.6" y="70">HL7 standards</text><text class="s" x="587.6" y="88">FHIR R4, CQL, CPG, SDC,</text><text class="s" x="587.6" y="103">CRMI, Europe HDR</text><text class="tag" x="587.6" y="122">open standards</text>
