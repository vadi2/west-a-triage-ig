name: Build IG

# All IG builds run here, not locally: SUSHI, the IG Publisher (which also translates
# the CQL in input/cql), its QA report, validation of the hand-written JSON on the
# profile pages, the negative tests, and the CQL test cases.
#
# The build job builds the IG, or reuses the IG built from the same sources by the same
# SUSHI and IG Publisher versions, and checks its QA report. Then the checks, cql and
# e2e jobs run in parallel on the ig-output artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build the IG even if one built from the same sources can be reused
        type: boolean
        default: false

# A new push to a pull request cancels its older runs; other runs are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-Xmx6g"
  # Bump to rebuild the IG when the way it is built changes, rather than its sources
  IG_CACHE_VERSION: "1"
  # The FHIR package cache, without the #current and #dev packages, which change
  FHIR_PACKAGES: |
    ~/.fhir/packages
    !~/.fhir/packages/*#current
    !~/.fhir/packages/*#dev

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      validator: ${{ steps.tools.outputs.validator }}
      month: ${{ steps.tools.outputs.month }}
      package: ${{ steps.package.outputs.built }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find the latest SUSHI, IG Publisher and validator
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sushi=$(npm view fsh-sushi version)
          publisher=$(gh api repos/HL7/fhir-ig-publisher/releases/latest --jq .tag_name)
          validator=$(gh api repos/hapifhir/org.hl7.fhir.core/releases/latest --jq .tag_name)
          [ -n "$sushi" ] && [ -n "$publisher" ] && [ -n "$validator" ]
          echo "SUSHI $sushi, IG Publisher $publisher, validator $validator" | tee ig-build.txt
          {
            echo "sushi=$sushi"
            echo "publisher=$publisher"
            echo "validator=$validator"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      # The IG is built only from input/ and the files below: a change elsewhere, such as
      # in demo/, reuses the IG (and its QA report) built from the same sources by the
      # same SUSHI and IG Publisher. It is kept only when its QA report has no errors.
      - name: Reuse the IG built from the same sources
        id: ig-cache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v6
        with:
          path: output
          key: ig-output-${{ env.IG_CACHE_VERSION }}-${{ steps.tools.outputs.publisher }}-${{ steps.tools.outputs.sushi }}-${{ hashFiles('input/**', 'sushi-config.yaml', 'ig.ini', 'expansion-params.json') }}

      - uses: actions/setup-node@v5
        if: steps.ig-cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"

      - uses: ruby/setup-ruby@v1
        if: steps.ig-cache.outputs.cache-hit != 'true'
        with:
          ruby-version: "3.3"

      - name: Find the Ruby version
        id: ruby
        if: steps.ig-cache.outputs.cache-hit != 'true'
        run: echo "version=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      # Jekyll builds native extensions, which takes most of its install time
      - name: Cache Jekyll
        if: steps.ig-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.jekyll-gems
          key: jekyll-${{ runner.os }}-ruby-${{ steps.ruby.outputs.version }}-${{ steps.tools.outputs.month }}

      - name: Install SUSHI and Jekyll
        if: steps.ig-cache.outputs.cache-hit != 'true'
        run: |
          npm install -g "fsh-sushi@${{ steps.tools.outputs.sushi }}"
          echo "GEM_HOME=$HOME/.jekyll-gems" >> "$GITHUB_ENV"
          echo "$HOME/.jekyll-gems/bin" >> "$GITHUB_PATH"
          GEM_HOME=$HOME/.jekyll-gems gem install --conservative --no-document jekyll

      - name: Restore the FHIR package cache
        id: fhir-cache
        if: steps.ig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: fhir-packages-${{ steps.tools.outputs.month }}-
          restore-keys: fhir-packages-${{ steps.tools.outputs.month }}-

      - name: Run SUSHI
        if: steps.ig-cache.outputs.cache-hit != 'true'
        run: sushi .

      - name: Download IG Publisher
        if: steps.ig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p input-cache
          curl -fsSL -o input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${{ steps.tools.outputs.publisher }}/publisher.jar"

      # -no-sushi: SUSHI already ran in its own step
      - name: Build IG
        if: steps.ig-cache.outputs.cache-hit != 'true'
        run: java -jar input-cache/publisher.jar -ig . -no-sushi

      - name: Check QA report
        id: qa
        run: python3 .github/scripts/check_qa.py output/qa.json

      - name: Keep the IG for builds from the same sources
        if: ${{ steps.ig-cache.outputs.cache-hit != 'true' && !inputs.rebuild }}
        uses: actions/cache/save@v6
        with:
          path: output
          key: ${{ steps.ig-cache.outputs.cache-primary-key }}

      - name: List the FHIR packages
        id: fhir-packages
        if: ${{ !cancelled() && steps.ig-cache.outputs.cache-hit != 'true' }}
        run: |
          du -sh ~/.fhir/packages || true
          echo "key=fhir-packages-${{ steps.tools.outputs.month }}-$(ls ~/.fhir/packages | grep -v '#current$\|#dev$' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save the FHIR package cache
        if: ${{ !cancelled() && steps.fhir-packages.outputs.key && steps.fhir-packages.outputs.key != steps.fhir-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: ${{ steps.fhir-packages.outputs.key }}

      - name: Check that the package was built
        id: package
        if: ${{ !cancelled() }}
        run: echo "built=${{ hashFiles('output/package.tgz') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.ig-cache.outputs.cache-hit }}" = true ]; then
            echo "Reused the IG built from the same sources by the same tools" >> ig-build.txt
          fi
          cat qa-summary.txt >> ig-build.txt 2>/dev/null || echo "No QA summary" >> ig-build.txt
          {
            echo "### IG build"
            cat ig-build.txt
            echo
            echo "Download the **ig-output** artifact and open \`output/qa.html\` for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built IG
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ig-output
          path: |
            output/
            ig-build.txt
          retention-days: 14

  # Validation of the JSON on the profile pages, of the negative tests and of the
  # Observations extracted from the example triage form
  checks:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.package == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built IG
        uses: actions/download-artifact@v5
        with:
          name: ig-output

      - name: Restore the FHIR package cache
        id: fhir-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: fhir-packages-${{ needs.build.outputs.month }}-
          restore-keys: fhir-packages-${{ needs.build.outputs.month }}-

      - name: Download validator
        run: |
          mkdir -p input-cache
          curl -fsSL -o input-cache/validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${{ needs.build.outputs.validator }}/validator_cli.jar"

      # In one validator run, which takes about 20 s to start
      - name: Validate JSON examples on profile pages, and check that invalid test instances are rejected
        if: ${{ !cancelled() && hashFiles('output/package.tgz') != '' }}
        run: |
          python3 .github/scripts/extract_page_json.py input/pagecontent page-json
          # Validate each file against the profile in its meta.profile, so a
          # missing or unresolvable profile fails instead of falling back to base FHIR.
          python3 .github/scripts/validate.py page-json/*.json --invalid .github/tests/invalid/*.json

      - name: Extract and validate the vital signs of the example triage form
        if: ${{ !cancelled() && hashFiles('output/package.tgz') != '' }}
        run: |
          # SDC template-based extraction of the example QuestionnaireResponse, with the
          # library of the demo app (demo/lib/extract.js), then each extracted Observation
          # is validated against the WEST-A profile in its meta.profile.
          (cd demo/lib && npm install --no-package-lock --no-audit --no-fund \
            && node extract.test.mjs ../../output --write ../../extracted)
          status=0
          python3 .github/scripts/validate.py extracted/*.json || status=1
          [ "$(ls extracted/*.json | wc -l)" -eq 7 ] || { echo "::error::expected 7 extracted Observations"; status=1; }
          exit $status

      - name: List the FHIR packages
        id: fhir-packages
        if: ${{ !cancelled() }}
        run: echo "key=fhir-packages-${{ needs.build.outputs.month }}-$(ls ~/.fhir/packages | grep -v '#current$\|#dev$' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save the FHIR package cache
        if: ${{ !cancelled() && steps.fhir-packages.outputs.key != steps.fhir-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: ${{ steps.fhir-packages.outputs.key }}

      - name: Upload the validated files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ig-checks
          path: |
            page-json/
            extracted/
            .github/tests/invalid/
          retention-days: 14

  # The clinical views (scripts/clinical-views) are generated from the built IG and
  # committed, since build.fhir.org builds from the repository. On main, regenerate them
  # from this build and commit them when they changed. A push made with the workflow
  # token starts no new workflow run.
  clinical-views:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.package == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download built IG
        uses: actions/download-artifact@v5
        with:
          name: ig-output

      - name: Restore the FHIR package cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: fhir-packages-${{ needs.build.outputs.month }}-
          restore-keys: fhir-packages-${{ needs.build.outputs.month }}-

      # Without its dependency packages the generator would commit views that lack
      # their base profiles and value sets
      - name: Check the dependency packages
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          ig = json.loads(next(pathlib.Path('output').glob('ImplementationGuide-*.json')).read_text())
          deps = [f"{d['packageId']}#{d['version']}" for d in ig.get('dependsOn', [])]
          deps.append(f"hl7.fhir.r4.core#{ig['fhirVersion'][0]}")
          missing = [d for d in deps if not (pathlib.Path.home() / '.fhir/packages' / d).is_dir()]
          if missing:
              sys.exit(f"::error::missing FHIR packages: {', '.join(missing)}")
          PY

      - name: Regenerate the clinical views
        run: python3 scripts/clinical-views/generate.py --output-dir output --config scripts/clinical-views/views.json --ig input/images/clinical-views

      - name: Commit the changed views
        run: |
          git add input/images/clinical-views input/includes input/pagecontent
          if git diff --cached --quiet; then
            echo "The clinical views are up to date" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has a newer commit, whose run regenerates the views"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Regenerate clinical views"
          git push origin HEAD:main

  cql:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.package == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Download built IG
        uses: actions/download-artifact@v5
        with:
          name: ig-output

      - name: Run the CQL test cases
        if: ${{ !cancelled() && hashFiles('output/package.tgz') != '' }}
        working-directory: .github/tests/cql
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node run.mjs ../../../output

  # The WEST-A triage demo end to end: HAPI FHIR with clinical reasoning runs the
  # guideline from the package just built (demo/hapi/load.mjs, demo/e2e/run.mjs), and the
  # NEWS2 and triage Observations it records are validated against their profiles.
  e2e:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    services:
      hapi:
        # The same image as demo/hapi/start.sh
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
        env:
          HAPI_FHIR_FHIR_VERSION: R4
          HAPI_FHIR_CR_ENABLED: "true"
          SPRING_AI_MCP_SERVER_ENABLED: "false"
          # The CQL engine searches through HAPI: do not reuse the results of an
          # identical search, or newly recorded vital signs are not seen
          SPRING_APPLICATION_JSON: '{"hapi":{"fhir":{"reuse_cached_search_results_millis":0,"cr":{"cql":{"data":{"terminology_parameter_mode":"USE_INLINE_CODES"}}}}}}'
          JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built IG
        uses: actions/download-artifact@v5
        with:
          name: ig-output

      - name: Install the demo library's dependencies
        working-directory: demo/lib
        run: |
          if jq -e '(.dependencies // {}) | length > 0' package.json > /dev/null; then
            npm install --no-package-lock --no-audit --no-fund
          fi

      # Before waiting for HAPI, which starts meanwhile
      - name: Restore the FHIR package cache
        id: fhir-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: fhir-packages-${{ needs.build.outputs.month }}-
          restore-keys: fhir-packages-${{ needs.build.outputs.month }}-

      - name: Download validator
        run: |
          curl -fsSL -o validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${{ needs.build.outputs.validator }}/validator_cli.jar"

      - name: Wait for HAPI
        run: |
          for i in $(seq 1 300); do
            curl -fs -o /dev/null http://localhost:8080/fhir/metadata && { echo "HAPI is up"; exit 0; }
            sleep 2
          done
          echo "::error::HAPI did not start"; exit 1

      - name: Load the guide into HAPI
        run: node demo/hapi/load.mjs output/package.tgz

      - name: Run the end-to-end test
        run: node demo/e2e/run.mjs --base http://localhost:8080/fhir --out e2e-output

      - name: Validate the recorded NEWS2 (final and preliminary) and triage Observations
        run: |
          python3 .github/scripts/validate.py --info --validator validator_cli.jar \
            e2e-output/news2.json e2e-output/news2-preliminary.json e2e-output/triage.json

      - name: List the FHIR packages
        id: fhir-packages
        if: ${{ !cancelled() }}
        run: echo "key=fhir-packages-${{ needs.build.outputs.month }}-$(ls ~/.fhir/packages | grep -v '#current$\|#dev$' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save the FHIR package cache
        if: ${{ !cancelled() && steps.fhir-packages.outputs.key != steps.fhir-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FHIR_PACKAGES }}
          key: ${{ steps.fhir-packages.outputs.key }}

      - name: Upload the end-to-end output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-output
          path: e2e-output/
          retention-days: 14
