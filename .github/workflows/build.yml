name: Build IG

# All IG builds run here, not locally: SUSHI, the IG Publisher (which also translates
# the CQL in input/cql), its QA report, validation of the hand-written JSON on the
# profile pages, the negative tests, and the CQL test cases.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Xmx6g"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install SUSHI and Jekyll
        run: |
          npm install -g fsh-sushi
          gem install jekyll

      - name: Run SUSHI
        run: sushi .

      - name: Download IG Publisher and validator
        run: |
          mkdir -p input-cache
          curl -fsSL -o input-cache/publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar
          curl -fsSL -o input-cache/validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig .

      - name: Check QA report
        id: qa
        run: python3 .github/scripts/check_qa.py output/qa.json

      - name: Validate JSON examples on profile pages
        if: ${{ !cancelled() && hashFiles('output/package.tgz') != '' }}
        run: |
          python3 .github/scripts/extract_page_json.py input/pagecontent page-json
          # Validate each file against the profile in its meta.profile, so a
          # missing or unresolvable profile fails instead of falling back to base FHIR.
          status=0
          for f in page-json/*.json; do
            [ -e "$f" ] || continue
            profile=$(jq -r '.meta.profile[0] // empty' "$f")
            [ -n "$profile" ] || { echo "::error file=$f::no meta.profile"; status=1; continue; }
            java -jar input-cache/validator_cli.jar "$f" -version 4.0.1 -sct se \
              -ig output/package.tgz -profile "$profile" > "$f.txt" 2>&1 || true
            sed -n '/^Validat\|Success\|\*FAILURE\*\|Error @\|Warning @/p' "$f.txt"
            if ! grep -q "^Success" "$f.txt"; then
              echo "::error file=$f::failed validation against $profile"; status=1
            fi
          done
          exit $status

      - name: Check that invalid test instances are rejected
        if: ${{ !cancelled() && hashFiles('output/package.tgz') != '' }}
        run: |
          status=0
          for f in .github/tests/invalid/*.json; do
            profile=$(jq -r '.meta.profile[0]' "$f")
            java -jar input-cache/validator_cli.jar "$f" -version 4.0.1 -sct se \
              -ig output/package.tgz -profile "$profile" > "$f.txt" 2>&1 || true
            sed -n '/Success\|\*FAILURE\*\|Error @/p' "$f.txt"
            if grep -q "^Success" "$f.txt"; then
              echo "::error file=$f::expected validation to fail, but it passed"; status=1
            fi
          done
          exit $status

      - name: Run the CQL test cases
        if: ${{ !cancelled() && hashFiles('output/package.tgz') != '' }}
        working-directory: .github/tests/cql
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node run.mjs ../../../output

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### IG build"
            cat qa-summary.txt 2>/dev/null || echo "No QA summary"
            echo
            echo "Download the **ig-output** artifact and open \`qa.html\` for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built IG
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ig-output
          path: |
            output/
            page-json/
          retention-days: 14

  # The WEST-A triage demo end to end: HAPI FHIR with clinical reasoning runs the
  # guideline from the package just built (demo/hapi/load.mjs, demo/e2e/run.mjs), and the
  # NEWS2 and triage Observations it records are validated against their profiles.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    services:
      hapi:
        # The same image as demo/hapi/start.sh
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
        env:
          HAPI_FHIR_FHIR_VERSION: R4
          HAPI_FHIR_CR_ENABLED: "true"
          SPRING_AI_MCP_SERVER_ENABLED: "false"
          # The CQL engine searches through HAPI: do not reuse the results of an
          # identical search, or newly recorded vital signs are not seen
          SPRING_APPLICATION_JSON: '{"hapi":{"fhir":{"reuse_cached_search_results_millis":0,"cr":{"cql":{"data":{"terminology_parameter_mode":"USE_INLINE_CODES"}}}}}}'
          JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built IG
        uses: actions/download-artifact@v5
        with:
          name: ig-output

      - name: Install the demo library's dependencies
        working-directory: demo/lib
        run: |
          if jq -e '(.dependencies // {}) | length > 0' package.json > /dev/null; then
            npm install --no-package-lock --no-audit --no-fund
          fi

      - name: Wait for HAPI
        run: |
          for i in $(seq 1 120); do
            curl -fs -o /dev/null http://localhost:8080/fhir/metadata && { echo "HAPI is up"; exit 0; }
            sleep 5
          done
          echo "::error::HAPI did not start"; exit 1

      - name: Load the guide into HAPI
        run: node demo/hapi/load.mjs output/package.tgz

      - name: Run the end-to-end test
        run: node demo/e2e/run.mjs --base http://localhost:8080/fhir --out e2e-output

      - name: Download validator
        run: |
          curl -fsSL -o validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      - name: Validate the recorded NEWS2 and triage Observations
        run: |
          status=0
          for f in e2e-output/news2.json e2e-output/triage.json; do
            profile=$(jq -r '.meta.profile[0] // empty' "$f")
            [ -n "$profile" ] || { echo "::error file=$f::no meta.profile"; status=1; continue; }
            java -jar validator_cli.jar "$f" -version 4.0.1 -sct se \
              -ig output/package.tgz -profile "$profile" > "$f.txt" 2>&1 || true
            sed -n '/^Validat\|Success\|\*FAILURE\*\|Error @\|Warning @\|Information @/p' "$f.txt"
            if ! grep -q "^Success" "$f.txt"; then
              echo "::error file=$f::failed validation against $profile"; status=1
            fi
          done
          exit $status

      - name: Upload the end-to-end output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-output
          path: e2e-output/
          retention-days: 14
