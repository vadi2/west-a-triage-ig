    <title>WEST-A Triage IG</title>
    <script>
      // A canonical URL of the guide, such as /west-a-triage-ig/StructureDefinition/west-a-patient,
      // goes to its page in the current build; anything else to the guide's home page.
      (function () {
        var ig = 'https://build.fhir.org/ig/vadi2/west-a-triage-ig/en/';
        var m = window.location.pathname.match(/\/west-a-triage-ig\/([A-Z][A-Za-z]+)\/([A-Za-z0-9.-]+)\/?$/);
        window.location.replace(m ? ig + m[1] + '-' + m[2] + '.html' : ig);
      })();
    </script>
